services:
  postgres:
    image: postgres:16-alpine
    container_name: ares-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ares_checkpoints}
      POSTGRES_USER: ${POSTGRES_USER:-ares}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ares_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ares_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ares} -d ${POSTGRES_DB:-ares_checkpoints}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ares_postgres_data:
    driver: local
